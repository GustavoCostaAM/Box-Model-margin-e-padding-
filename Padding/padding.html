<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Manipulação</title>
    <link rel="stylesheet" href="padding.css">
</head>

<body>
    <header>
        <div class="header-content">
            <h1>Manipulação de Padding</h1>
            <nav>
                <ul>
                    <li><a target="_blank" href="Border/border.html">Border</a></li>
                    <li><a target="_blank" href="https://institutogerminare-my.sharepoint.com/:p:/g/personal/lorenzo_oliveira_germinare_org_br/EefRxSZo7ddJq3jT7cKulrABxOmjPgnG5teQbaEal_RzrQ?e=M8EFjn">Power point</a></li>
                    <li><a target="_blank" href="index.html">Home</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="container">
        <h2>Exemplo de Manipulação</h2>
        <p>Mova os controles abaixo para alterar o <strong>padding</strong> do bloco.</p>

        <div id="blocoManipulacao">
            BLOCO
        </div>

        <div class="controls">
            <label>
                Padding Top:
                <input type="range" min="0" max="100" value="20" id="paddingTop">
                <span id="valTop">20px</span>
            </label>
            <label>
                Padding Right:
                <input type="range" min="0" max="100" value="20" id="paddingRight">
                <span id="valRight">20px</span>
            </label>
            <label>
                Padding Bottom:
                <input type="range" min="0" max="100" value="20" id="paddingBottom">
                <span id="valBottom">20px</span>
            </label>
            <label>
                Padding Left:
                <input type="range" min="0" max="100" value="20" id="paddingLeft">
                <span id="valLeft">20px</span>
            </label>
        </div>
    </main>

    <footer>
        <p>&copy; Todos direitos reservados &reg;</p>
    </footer>

    <script src="padding.js"></script>
</body>

</html>
